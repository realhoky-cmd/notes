<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심플 메모</title>
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="심플 메모">
<style>
:root {
  color-scheme: light dark;
  --editor-bg: #ffffff;
  --list-bg: #f6f6f6;
  --m-bg: #f2f2f7;
  --text: #1d1d1f;
  --text-2: #86868b;
  --line: #e2e2e4;
  --sel: #d6e8fc;
  --sel-text: #1d1d1f;
  --sel-2: #e8e8ea;
  --accent: #4a9be8;
  --on-accent: #ffffff;
  --icon: #6e6e73;
  --search-bg: #e8e8ea;
  --hover: rgba(0, 0, 0, .05);
  --danger: #d93025;
  --toast-bg: #2c2c2e;
  --toast-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --editor-bg: #1e1e1e;
    --list-bg: #262626;
    --m-bg: #000000;
    --text: #f5f5f7;
    --text-2: #98989d;
    --line: #3a3a3c;
    --sel: #24476e;
    --sel-text: #ffffff;
    --sel-2: #3a3a3c;
    --accent: #7cbaf7;
    --on-accent: #0d1b2a;
    --icon: #a1a1a6;
    --search-bg: #353537;
    --hover: rgba(255, 255, 255, .06);
    --danger: #ff6b5e;
    --toast-bg: #e5e5ea;
    --toast-text: #1d1d1f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
  background: var(--editor-bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
svg { display: block; }

#app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* 목록 */
#listPane { background: var(--list-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.list-head { display: flex; align-items: center; gap: 2px; padding: 14px 10px 8px 20px; }
.list-head h1 { flex: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--icon); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn:focus-visible, .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.on { color: var(--accent); }
.sync.s-error { color: var(--danger); }
.sync.s-syncing svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.search { position: relative; margin: 0 12px 6px; }
.search svg { position: absolute; left: 9px; top: 7px; width: 16px; height: 16px; color: var(--text-2); pointer-events: none; }
.search input { width: 100%; height: 30px; border: 0; border-radius: 8px; background: var(--search-bg); color: var(--text); padding: 0 10px 0 31px; font: inherit; font-size: 14px; outline: none; }
.search input::placeholder { color: var(--text-2); }
.search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.search input::-webkit-search-cancel-button { cursor: pointer; }

#list { flex: 1; overflow-y: auto; padding: 0 10px 16px; outline: none; }
.group h3 { margin: 14px 10px 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.item { position: relative; padding: 9px 12px 10px; border-radius: 8px; cursor: default; user-select: none; }
.item::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 1px; background: var(--line); }
.item:last-child::after, .item.sel::after, .item:has(+ .item.sel)::after { display: none; }
.item.sel { background: var(--sel); }
.item .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .m { display: flex; gap: 8px; margin-top: 2px; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.item .d { flex: none; color: var(--text); opacity: .85; }
.item .p { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.item.sel .t, .item.sel .d { color: var(--sel-text); }
.item.sel .p { color: var(--sel-text); opacity: .7; }
.none { margin: 40px 0; text-align: center; color: var(--text-2); font-size: 14px; }

.list-foot { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 6px 12px 6px 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
.foot-info { flex: 1; min-width: 0; display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }
#syncText { overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
#syncText:empty { display: none; }
#count:not(:empty) + #syncText::before { content: "·"; margin-right: 6px; }
#newBtn2 { display: none; }

/* 편집기 */
#editorPane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--editor-bg); }
.editor-head { display: flex; align-items: center; gap: 2px; height: 52px; padding: 10px 14px 0; flex: none; }
.editor-head .spacer { flex: 1; }
.back { display: none; align-items: center; gap: 2px; height: 36px; padding: 0 6px 0 0; border: 0; background: none; color: var(--accent); font-size: 17px; cursor: pointer; }
.back svg { width: 24px; height: 24px; }
.editor-scroll { position: relative; flex: 1; overflow-y: auto; padding: 2px 0 35vh; cursor: text; }
.note-tools .sep { width: 1px; height: 20px; margin: 0 6px; background: var(--line); }
.date { margin: 0 0 14px; text-align: center; font-size: 12px; color: var(--text-2); user-select: none; }
.editor {
  max-width: 780px; margin: 0 auto; padding: 0 44px; min-height: 50vh;
  font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
  outline: none; caret-color: var(--accent);
}
.editor > div:first-child:not(.chk):not(.img) { font-size: 1.6em; font-weight: 700; line-height: 1.45; }

/* 체크리스트 */
.editor .chk { position: relative; padding-left: 28px; }
.editor .chk::before { content: ""; position: absolute; left: 1px; top: calc(.8em - 9px); width: 18px; height: 18px; border: 1.5px solid var(--text-2); border-radius: 50%; cursor: pointer; }
.editor .chk.done { color: var(--text-2); }
.editor .chk.done::before { border-color: var(--accent); background: var(--accent); }
.editor .chk.done::after { content: ""; position: absolute; left: 7px; top: calc(.8em - 6px); width: 6px; height: 10px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }

/* 표 */
.editor .tbl { display: block; max-width: 100%; overflow-x: auto; margin: 8px 0; border-collapse: collapse; }
.editor .tbl td, .editor .tbl th { min-width: 90px; padding: 5px 10px; border: 1px solid var(--line); vertical-align: top; text-align: left; font-weight: 400; overflow-wrap: break-word; }
.editor .tbl tr:first-child > * { font-weight: 600; background: var(--list-bg); }
.tblbar { position: absolute; z-index: 2; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--editor-bg); box-shadow: 0 4px 14px rgba(0, 0, 0, .12); cursor: default; }
.tblbar[hidden] { display: none; }
.tblbar button { height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; white-space: nowrap; cursor: pointer; }
.tblbar button:hover { background: var(--hover); }
.tblbar button.danger { color: var(--danger); }

/* 사진 */
.editor .img { position: relative; width: fit-content; max-width: 100%; margin: 8px 0; line-height: 0; cursor: default; user-select: none; -webkit-user-select: none; }
.editor .img img { display: block; max-width: 100%; height: auto; border-radius: 8px; }
.editor .img.loading img, .editor .img.missing img { width: 240px; height: 140px; background: var(--search-bg); }
.editor .img.missing::after { content: "사진을 불러오지 못했어요"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; line-height: 1.4; color: var(--text-2); }
.editor .img.on img { outline: 2px solid var(--accent); outline-offset: 2px; }
.editor .img .rz { position: absolute; right: -8px; bottom: -8px; display: none; width: 20px; height: 20px; border: 3px solid var(--editor-bg); border-radius: 50%; background: var(--accent); cursor: nwse-resize; touch-action: none; }
.editor .img .x { position: absolute; top: 8px; right: 8px; display: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; place-items: center; cursor: pointer; }
.editor .img .x svg { width: 16px; height: 16px; }
.editor .img.on .rz { display: block; }
.editor .img.on .x { display: grid; }
@media (hover: hover) { .editor .img:hover .rz { display: block; } }
.empty { position: absolute; inset: 52px 0 0; display: grid; place-items: center; color: var(--text-2); font-size: 15px; user-select: none; }
#app.has-note .empty { display: none; }
#app:not(.has-note) .editor-scroll, #app:not(.has-note) .note-tools { visibility: hidden; }

/* 설정 */
dialog { width: min(460px, calc(100vw - 32px)); padding: 22px 22px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--editor-bg); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(0, 0, 0, .3); }
dialog h2 { margin: 0 0 6px; font-size: 17px; }
dialog .hint { margin: 0 0 16px; font-size: 13px; line-height: 1.55; color: var(--text-2); }
dialog label { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 600; }
dialog input { display: block; width: 100%; height: 36px; margin-top: 5px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--list-bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 400; outline: none; }
dialog input:focus { border-color: var(--accent); }
.msg { min-height: 18px; margin: 0 0 10px; font-size: 13px; color: var(--text-2); }
.msg.err { color: var(--danger); }
.row { display: flex; align-items: center; gap: 8px; }
.row .spacer { flex: 1; }
.btn { height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; }
.btn.primary { border-color: transparent; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.link { padding: 0; border: 0; background: none; color: var(--accent); font-size: 13px; cursor: pointer; }
.link.danger { color: var(--danger); }
.extra { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }

/* 토스트 */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 10; width: max-content; max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-text); font-size: 14px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#toast button { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; }

/* 모바일 */
@media (max-width: 720px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #app.show-editor #listPane, #app:not(.show-editor) #editorPane { display: none; }
  #listPane { border-right: 0; background: var(--m-bg); }
  .list-head { padding: calc(env(safe-area-inset-top) + 10px) 10px 4px 18px; }
  .list-head h1 { font-size: 32px; }
  #newBtn { display: none; }
  .icon-btn { width: 40px; height: 40px; color: var(--accent); }
  .icon-btn svg { width: 24px; height: 24px; }
  .search { margin: 4px 16px 4px; }
  .search input { height: 36px; font-size: 16px; border-radius: 10px; }
  .search svg { top: 10px; }
  #list { padding: 0 16px 16px; }
  .group h3 { margin: 20px 4px 8px; font-size: 20px; font-weight: 700; color: var(--text); }
  .group .card { overflow: hidden; border-radius: 12px; background: var(--editor-bg); }
  .item { padding: 11px 16px 12px; border-radius: 0; }
  .item::after { left: 16px; right: 0; }
  .item.sel { background: transparent; }
  .item.sel::after, .item:has(+ .item.sel)::after { display: block; }
  .item:last-child::after { display: none; }
  .item.sel .t, .item.sel .d { color: var(--text); }
  .item.sel .p { color: var(--text-2); opacity: 1; }
  .item:active { background: var(--sel-2); }
  .item .t { font-size: 16px; }
  .item .m { font-size: 14px; }
  .list-foot { justify-content: center; position: relative; min-height: 48px; padding: 6px 60px calc(6px + env(safe-area-inset-bottom)); border-top: 0; background: var(--m-bg); }
  .foot-info { flex: none; flex-direction: column; align-items: center; gap: 0; }
  #count:not(:empty) + #syncText::before { content: none; }
  #newBtn2 { display: grid; position: absolute; right: 10px; top: 4px; }
  .editor-head { height: auto; padding: calc(env(safe-area-inset-top) + 6px) 8px 4px 8px; }
  .back { display: flex; }
  .editor-scroll { padding-bottom: 45vh; }
  .editor { padding: 0 20px; font-size: 17px; line-height: 1.55; }
  .editor .img .rz { width: 26px; height: 26px; right: -10px; bottom: -10px; }
  .note-tools .sep { margin: 0 2px; }
  .empty { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="listPane">
    <header class="list-head">
      <h1>메모</h1>
      <button id="syncBtn" class="icon-btn sync" type="button" aria-label="동기화"></button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="설정" title="설정"></button>
      <button id="newBtn" class="icon-btn" type="button" aria-label="새로운 메모"></button>
    </header>
    <div class="search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="검색" autocomplete="off" spellcheck="false" aria-label="메모 검색">
    </div>
    <div id="list" role="listbox" tabindex="0" aria-label="메모 목록"></div>
    <footer class="list-foot">
      <div class="foot-info"><span id="count"></span><span id="syncText"></span></div>
      <button id="newBtn2" class="icon-btn" type="button" aria-label="새로운 메모"></button>
    </footer>
  </aside>

  <main id="editorPane">
    <header class="editor-head">
      <button id="backBtn" class="back" type="button"><span data-icon="back"></span>메모</button>
      <span class="spacer"></span>
      <span class="note-tools" style="display:flex;gap:2px;align-items:center">
        <button id="chkBtn" class="icon-btn" type="button" aria-label="체크리스트"></button>
        <button id="tableBtn" class="icon-btn" type="button" aria-label="표"></button>
        <button id="imgBtn" class="icon-btn" type="button" aria-label="사진 넣기" title="사진 넣기"></button>
        <span class="sep"></span>
        <button id="pinBtn" class="icon-btn" type="button" aria-label="고정"></button>
        <button id="deleteBtn" class="icon-btn" type="button" aria-label="삭제" title="삭제"></button>
      </span>
    </header>
    <div class="editor-scroll" id="editorScroll">
      <div id="date" class="date"></div>
      <div id="editor" class="editor" spellcheck="false" aria-label="메모 내용"></div>
      <div id="tblBar" class="tblbar" hidden>
        <button type="button" data-t="row">+ 행</button>
        <button type="button" data-t="col">+ 열</button>
        <button type="button" data-t="delrow">− 행</button>
        <button type="button" data-t="delcol">− 열</button>
        <button type="button" data-t="del" class="danger">표 삭제</button>
      </div>
    </div>
    <div class="empty">메모를 선택하거나 새로 만들어 보세요</div>
    <input id="imgInput" type="file" accept="image/*" multiple hidden>
  </main>
</div>

<dialog id="settings">
  <h2>동기화 설정</h2>
  <p class="hint">구글 Apps Script로 배포한 웹 앱 주소와 비밀번호를 넣으세요. 메모는 내 구글 드라이브의 SimpleNotes 폴더에 저장돼요. 연결하지 않으면 이 기기에만 저장돼요.</p>
  <label>웹 앱 주소
    <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
  </label>
  <label>비밀번호
    <input id="cfgSecret" type="password" autocomplete="off" spellcheck="false">
  </label>
  <p id="cfgMsg" class="msg"></p>
  <div class="row">
    <span class="spacer"></span>
    <button id="cfgCancel" class="btn" type="button">취소</button>
    <button id="cfgSave" class="btn primary" type="button">저장</button>
  </div>
  <div class="extra" id="cfgExtra">
    <button id="cfgLink" class="link" type="button">다른 기기용 설정 링크 복사</button>
    <button id="cfgOff" class="link danger" type="button">이 기기에서 동기화 끄기</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- 아이콘 ---------- */
  const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const CLOUD = '<path d="M7 18.5h10.2a4.3 4.3 0 0 0 .5-8.57A5.8 5.8 0 0 0 6.6 9.6 4.45 4.45 0 0 0 7 18.5z"/>';
  const ICON = {
    compose: svg('<path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M17.6 3.6a2 2 0 0 1 2.8 2.8L12.2 14.6l-3.7.9.9-3.7z"/>'),
    search: svg('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'),
    settings: svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
    pin: svg('<path d="M9 3.5h6l-1 6.2 3.2 3.1v1.4H6.8v-1.4L10 9.7z"/><path d="M12 14.2V20.5"/>'),
    trash: svg('<path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l.9 12.5h9.2l.9-12.5"/><path d="M10.2 11v5M13.8 11v5"/>'),
    back: svg('<path d="m15 5-7 7 7 7"/>'),
    cloud: svg(CLOUD),
    cloudOk: svg(CLOUD + '<path d="m9.4 13.6 2 2 3.6-3.7"/>'),
    cloudOff: svg(CLOUD + '<path d="M4 4l16 16"/>'),
    sync: svg('<path d="M19.5 10.5A7.7 7.7 0 0 0 5.6 7.2M4.5 13.5a7.7 7.7 0 0 0 13.9 3.3"/><path d="M5 3.5v4h4M19 20.5v-4h-4"/>'),
    checklist: svg('<circle cx="6.5" cy="7" r="2.6"/><path d="m5.3 7.1.9.9 1.6-1.7"/><circle cx="6.5" cy="17" r="2.6"/><path d="M11.5 7h8.5M11.5 17h8.5"/>'),
    table: svg('<rect x="3.5" y="5" width="17" height="14" rx="2.2"/><path d="M3.5 9.8h17M3.5 14.4h17M10.5 5v14"/>'),
    image: svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="m20.5 15.5-4.8-4.8-8.6 8.6"/>'),
    close: svg('<path d="M7 7l10 10M17 7 7 17"/>')
  };

  /* ---------- 저장소 ---------- */
  const TEST = (() => { try { return (window.parent !== window && window.parent.SN_TEST) || null; } catch (e) { return null; } })();
  const PREFIX = 'sn.' + (TEST ? window.name + '.' : '');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };

  let notes = store.get('notes', {});
  let meta = store.get('meta', { since: 0, lastSync: 0 });
  let cfg = store.get('cfg', { url: '', secret: '' });
  let currentId = store.get('current', null);
  let saveTimer = null, saveWarned = false;

  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    const ok = store.set('notes', notes) && store.set('meta', meta) && store.set('current', currentId);

    let b = ctx && (ctx.cell ? ctx.cell.closest('table') : ctx.block);

    if (!b) { const last = editor.lastElementChild; if (last) last.after(el); else editor.appendChild(el); atEnd = true; }

    else if (!textOf([b]) && !b.classList.contains('chk')) b.before(el);
    else if (caretAtEnd(b, ctx.range)) { b.after(el); atEnd = true; }

  /* ---------- 편집기: 사진 ---------- */
  const imgUrls = new Map(), imgMem = new Map(), imgLoading = new Map();
  const imgPending = new Set(store.get('imgPending', []));
  const savePending = () => store.set('imgPending', [...imgPending]);
  const MIME = { jpg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp' };
  const mimeOf = (name) => MIME[name.split('.').pop()] || 'image/jpeg';

  let idbP = null;
  function idbOpen() {
    if (!idbP) {
      idbP = new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no idb'));
        const r = indexedDB.open('sn-images' + (TEST ? '.' + window.name : ''), 1);
        r.onupgradeneeded = () => r.result.createObjectStore('img');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));

  }
  async function imgGet(name) {
    if (imgMem.has(name)) return imgMem.get(name);

    if (!db) return null;
    return new Promise((res) => {
      try {
        const q = db.transaction('img').objectStore('img').get(name);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function imgPut(name, rec) {
    const db = await idbOpen();
    if (!db) { imgMem.set(name, rec); return; }
    await new Promise((res) => {
      try {
        const t = db.transaction('img', 'readwrite');
        t.objectStore('img').put(rec, name);
        t.oncomplete = res;
        t.onerror = t.onabort = () => { imgMem.set(name, rec); res(); };
      } catch (e) { imgMem.set(name, rec); res(); }

  function bufToB64(buf) {
    const bytes = new Uint8Array(buf);

    if (imgUrls.has(name)) return Promise.resolve(imgUrls.get(name));

    const p = (async () => {
      let rec = await imgGet(name);
      if (!rec && cfg.url && !authFailed) {
        try {
          const res = await post({ secret: cfg.secret, op: 'img_get', name });
          if (res && res.ok && res.name === name && res.data) {

  function hydrateImages() {

    };
    const end = () => {
      rz.removeEventListener('pointermove', move);
      rz.removeEventListener('pointerup', end);
      rz.removeEventListener('pointercancel', end);
      commit();
    };
    rz.addEventListener('pointermove', move);
    rz.addEventListener('pointerup', end);
    rz.addEventListener('pointercancel', end);
  });

  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (sel.rangeCount && editor.contains(sel.anchorNode)) lastRange = sel.getRangeAt(0).cloneRange();
    updateTableBar();
  });
  editor.addEventListener('blur', () => { clearTimeout(barHideTimer); barHideTimer = setTimeout(updateTableBar, 250); });
  tblBar.addEventListener('mousedown', (e) => e.preventDefault());
  tblBar.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) tableAct(b.dataset.t); });

  for (const id of ['#chkBtn', '#tableBtn', '#imgBtn']) $(id).addEventListener('mousedown', (e) => e.preventDefault());
  $('#chkBtn').addEventListener('click', toggleChecklist);
  $('#tableBtn').addEventListener('click', insertTable);
  const imgInput = $('#imgInput');
  $('#imgBtn').addEventListener('click', () => { if (currentId) imgInput.click(); });
  imgInput.addEventListener('change', () => {
    const files = [...imgInput.files];
    imgInput.value = '';
    if (files.length) addImages(files);
  });

  $('#editorScroll').addEventListener('mousedown', (e) => {
    if (e.target === editor || editor.contains(e.target) || tblBar.contains(e.target) || !currentId) return;
    e.preventDefault();
    focusEditorEnd();
  });

  /* ---------- 메모 동작 ---------- */
  const inflight = new Set();

  function discardIfEmpty(id) {
    const n = id && notes[id];
    if (!n || n.deleted || n.text.trim()) return false;
    if (!n.rev && !inflight.has(id)) delete notes[id];
    else { n.deleted = true; n.dirty = true; n.v = (n.v || 0) + 1; scheduleSync(800); }
    if (currentId === id) currentId = null;
    saveSoon();
    return true;
  }

  function select(id, { focus = false } = {}) {
    if (currentId && currentId !== id) discardIfEmpty(currentId);
    currentId = notes[id] ? id : null;
    saveSoon();
    renderEditor();
    renderList();
    if (currentId) showEditor();
    if (focus) focusEditorEnd();
  }

  function newNote() {
    const cur = currentId && notes[currentId];
    if (searchEl.value) { searchEl.value = ''; }
    if (cur && !cur.deleted && !cur.text.trim()) { renderList(); showEditor(); focusEditorEnd(); return; }
    const now = Date.now();
    const id = newId();
    notes[id] = { id, text: '', created: now, updated: now, pinned: false, rev: 0, v: 0, dirty: false };
    select(id, { focus: true });
  }

  function togglePin() {
    const n = notes[currentId];
    if (!n) return;
    n.pinned = !n.pinned;
    n.v = (n.v || 0) + 1;
    n.dirty = true;
    renderMeta(n);
    renderList();
    saveSoon();
    scheduleSync(800);
  }

  function deleteCurrent() {
    const n = notes[currentId];
    if (!n) return;
    const snapshot = { ...n };
    const list = sortedNotes();
    const i = list.findIndex((x) => x.id === n.id);
    const next = list[i + 1] || list[i - 1] || null;
    if (!n.rev && !inflight.has(n.id)) delete notes[n.id];
    else { n.deleted = true; n.dirty = true; n.v = (n.v || 0) + 1; }
    currentId = next && !isMobile() ? next.id : null;
    saveSoon();
    renderEditor();
    renderList();
    if (isMobile()) showList(true);
    if (snapshot.text.trim()) toast('메모를 삭제했어요', '실행 취소', () => restore(snapshot));
    scheduleSync(1500);
  }

  function restore(snapshot) {
    const cur = notes[snapshot.id];
    notes[snapshot.id] = {
      ...snapshot,
      deleted: false,
      dirty: true,
      rev: cur ? cur.rev : snapshot.rev,
      v: Math.max(cur ? cur.v || 0 : 0, snapshot.v || 0) + 1
    };
    select(snapshot.id);
    scheduleSync(500);
  }

  /* ---------- 모바일 화면 전환 ---------- */
  function showEditor() {
    if (!isMobile() || app.classList.contains('show-editor')) return;
    app.classList.add('show-editor');
    history.pushState({ sn: 'editor' }, '');
  }
  function showList(fromDelete) {
    if (!fromDelete) discardIfEmpty(currentId);
    app.classList.remove('show-editor');
    editor.blur();
    renderList();
    if (history.state && history.state.sn === 'editor') history.back();
  }
  $('#backBtn').addEventListener('click', () => showList());
  window.addEventListener('popstate', () => {
    if (app.classList.contains('show-editor')) { discardIfEmpty(currentId); app.classList.remove('show-editor'); editor.blur(); renderList(); }
  });

  /* ---------- 동기화 ---------- */
  let syncing = false, syncAgain = false, syncTimer = null, lastAttempt = 0;
  let lastError = '', errorCount = 0, authFailed = false, status = 'idle';

  const ERR = {
    network: '서버에 연결할 수 없어요',
    bad_response: '서버 응답을 읽을 수 없어요. 웹 앱 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요',
    unauthorized: '비밀번호가 서버 코드의 SECRET과 달라요',
    secret_not_set: '서버 코드(Code.gs)의 SECRET 값을 먼저 바꾸고 새 버전으로 배포해 주세요',
    busy: '서버가 바빠요. 잠시 후 다시 시도해요',
    bad_request: '요청을 보내지 못했어요',
    server_error: '서버 오류가 났어요',
    server_outdated: '서버 코드(Code.gs)가 이전 버전이에요. 새 코드로 바꾸고 배포 관리에서 새 버전으로 배포해 주세요',
    img_too_large: '사진이 너무 커요'
  };
  class SyncError extends Error { constructor(code, detail) { super(code); this.code = code; this.detail = detail; } }

  function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
  const hasDirty = () => Object.values(notes).some((n) => n.dirty && (n.deleted || n.rev || n.text.trim()));

  function setStatus(s) {
    status = s;
    let icon = ICON.cloud, text = '';
    if (s === 'local') { icon = ICON.cloudOff; text = '이 기기에만 저장 중'; }
    else if (s === 'syncing') { icon = ICON.sync; text = '동기화 중…'; }
    else if (s === 'ok') { icon = ICON.cloudOk; text = '동기화됨 ' + fmtTime.format(meta.lastSync); }
    else if (s === 'offline') { icon = ICON.cloudOff; text = '연결 안 됨 · 이 기기에 저장됨'; }
    else if (s === 'error') { icon = ICON.cloudOff; text = '동기화 오류'; }
    syncBtn.innerHTML = icon;
    syncBtn.className = 'icon-btn sync s-' + s;
    syncBtn.title = s === 'error' ? '동기화 오류: ' + lastError : (s === 'local' ? '동기화 연결하기' : '지금 동기화');
    syncText.textContent = text;
    syncText.title = s === 'error' ? lastError : '';
  }

  async function post(body) {
    const payload = JSON.stringify(body);
    if (TEST) {
      try { return JSON.parse(await TEST.transport(cfg.url, payload)); }
      catch (e) { throw new SyncError('network'); }
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    let res;
    try {
      res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload, redirect: 'follow', signal: ctrl.signal });
    } catch (e) {
      throw new SyncError('network');
    } finally {
      clearTimeout(timer);
    }
    const txt = await res.text();
    try { return JSON.parse(txt); } catch (e) { throw new SyncError('bad_response'); }
  }

  async function sync() {
    clearTimeout(syncTimer);
    if (!cfg.url) { setStatus('local'); return; }
    if (authFailed) return;
    if (syncing) { syncAgain = true; return; }
    if (navigator.onLine === false) { setStatus('offline'); return; }
    syncing = true;
    lastAttempt = Date.now();
    setStatus('syncing');

    const sent = {};
    let ok = false;
    try {
      // 사진을 먼저 올려야 다른 기기가 메모를 받자마자 사진도 받아 올 수 있어요.
      const imgErr = imgPending.size ? await uploadImages() : null;
      const changes = [];
      for (const n of Object.values(notes)) {
        if (!n.dirty) continue;
        if (!n.deleted && !n.rev && !n.text.trim()) continue; // 비어 있는 새 메모는 올리지 않아요.
        if (n.deleted && !n.rev && !inflight.has(n.id)) { delete notes[n.id]; continue; }
        sent[n.id] = n.v;
        inflight.add(n.id);
        changes.push(n.deleted
          ? { id: n.id, deleted: true, updated: n.updated, base: n.rev || 0 }
          : { id: n.id, text: n.text, updated: n.updated, pinned: !!n.pinned, base: n.rev || 0 });
      }

      const res = await post({ secret: cfg.secret, since: meta.since || 0, changes });
      if (!res || !res.ok) throw new SyncError((res && res.error) || 'bad_response', res && res.detail);

      for (const [id, rev] of Object.entries(res.accepted || {})) {
        const n = notes[id];
        if (!n) continue;
        n.rev = rev;
        if (n.v === sent[id]) { n.dirty = false; if (n.deleted) delete notes[id]; }
      }

      let touchedCurrent = false, conflicted = false;
      for (const r of res.notes || []) {
        const local = notes[r.id];
        const unchangedSinceSend = r.id in sent && local && local.v === sent[r.id];
        // 보내는 동안 이 기기에서 또 고쳤다면 이 기기 버전을 지켜요. 다음 동기화에서 서버가 사본으로 보관해요.
        if (local && local.dirty && !unchangedSinceSend) continue;
        if (unchangedSinceSend && !local.deleted && !r.deleted && local.text.trim() !== String(r.text).trim()) conflicted = true;
        if (r.deleted) {
          if (local) { delete notes[r.id]; if (r.id === currentId) touchedCurrent = true; }
          continue;
        }
        notes[r.id] = {
          id: r.id, text: r.text, updated: r.updated, created: local ? local.created : r.updated,
          pinned: !!r.pinned, rev: r.rev, v: local ? local.v || 0 : 0, dirty: false
        };
        if (r.id === currentId) touchedCurrent = true;
      }

      meta.since = res.now || meta.since;
      meta.lastSync = Date.now();
      lastError = imgErr ? '사진을 올리지 못했어요. ' + (ERR[imgErr.code] || ERR.server_error) : '';
      errorCount = 0;
      ok = true;
      saveNow();
      renderList();
      if (touchedCurrent) applyRemoteToEditor();
      if (conflicted) toast('다른 기기에서도 고친 메모라 이 기기 내용은 사본 메모로 저장했어요');
      hydrateImages();
      setStatus(imgErr ? 'error' : 'ok');
    } catch (e) {
      const code = e instanceof SyncError ? e.code : 'network';
      lastError = (ERR[code] || ERR.server_error) + (e.detail ? ` (${e.detail})` : '');
      if (code === 'unauthorized' || code === 'secret_not_set') authFailed = true;
      errorCount++;
      setStatus(code === 'network' ? 'offline' : 'error');
      if (!authFailed) scheduleSync(Math.min(60000, 2000 * 2 ** errorCount));
    } finally {
      for (const id of Object.keys(sent)) inflight.delete(id);
      syncing = false;
      if (syncAgain) { syncAgain = false; scheduleSync(200); }
      else if (ok && hasDirty()) scheduleSync(1500);
    }
  }

  /** 이 기기에서 넣은 사진을 드라이브에 올려요. 연결·비밀번호 문제가 아니면 메모 동기화는 계속해요. */
  async function uploadImages() {
    let err = null;
    for (const name of [...imgPending]) {
      const rec = await imgGet(name);
      if (!rec) { imgPending.delete(name); continue; }
      let res;
      try {
        res = await post({ secret: cfg.secret, op: 'img_put', name, type: rec.type, data: bufToB64(rec.buf) });
      } catch (e) {
        if (!(e instanceof SyncError) || e.code === 'network') throw e;
        err = e;
        continue;
      }
      if (res && res.ok && res.saved === name) { imgPending.delete(name); continue; }
      const code = res && res.ok ? 'server_outdated' : (res && res.error) || 'bad_response';
      if (code === 'unauthorized' || code === 'secret_not_set' || code === 'busy') throw new SyncError(code);
      err = new SyncError(code, res && res.detail);
    }
    savePending();
    return err;
  }

  syncBtn.addEventListener('click', () => {
    if (!cfg.url || status === 'error') openSettings();
    else { authFailed = false; sync(); }
  });
  syncText.addEventListener('click', () => { if (status === 'error' || status === 'local') openSettings(); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { saveNow(); if (hasDirty() || imgPending.size) sync(); }
    else sync();
  });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('focus', () => { if (Date.now() - lastAttempt > 5000) sync(); });
  window.addEventListener('online', () => sync());
  window.addEventListener('offline', () => { if (cfg.url) setStatus('offline'); });
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);

  // 같은 기기에서 창을 두 개 열었을 때 서로 맞춰요.
  window.addEventListener('storage', (e) => {
    if (e.key === PREFIX + 'notes') {
      notes = store.get('notes', {});
      renderList();
      if (document.activeElement !== editor) applyRemoteToEditor();
    } else if (e.key === PREFIX + 'meta') {
      meta = store.get('meta', meta);
    } else if (e.key === PREFIX + 'cfg') {
      cfg = store.get('cfg', cfg);
      authFailed = false;
      sync();
    }
  });

  /* ---------- 설정 ---------- */
  const cfgUrl = $('#cfgUrl'), cfgSecret = $('#cfgSecret'), cfgMsg = $('#cfgMsg');

  function openSettings() {
    cfgUrl.value = cfg.url;
    cfgSecret.value = cfg.secret;
    cfgMsg.textContent = lastError || (cfg.url && meta.lastSync ? '마지막 동기화: ' + fmtFull.format(meta.lastSync) : '');
    cfgMsg.className = 'msg' + (lastError ? ' err' : '');
    $('#cfgExtra').style.display = cfg.url ? '' : 'none';
    dlg.showModal();
    (cfg.url ? cfgSecret : cfgUrl).focus();
  }

  function applyConfig(url, secret) {
    const prev = cfg.url;
    cfg = { url, secret };
    store.set('cfg', cfg);
    if (url && url !== prev) {
      // 다른 서버에 연결하면 이 기기의 메모를 모두 새로 올려요.
      meta.since = 0;
      for (const n of Object.values(notes)) {
        if (n.deleted) { delete notes[n.id]; continue; }
        n.rev = 0; n.dirty = true; n.v = (n.v || 0) + 1;
      }
      saveNow();
    }
    authFailed = false;
    errorCount = 0;
    lastError = '';
    if (url) sync(); else setStatus('local');
  }

  $('#cfgSave').addEventListener('click', () => {
    const url = cfgUrl.value.trim();
    const secret = cfgSecret.value;
    if (url && !/^https:\/\/\S+$/.test(url)) {
      cfgMsg.textContent = 'https:// 로 시작하는 웹 앱 주소를 넣어 주세요';
      cfgMsg.className = 'msg err';
      return;
    }
    if (url && !secret) {
      cfgMsg.textContent = '비밀번호를 넣어 주세요';
      cfgMsg.className = 'msg err';
      return;
    }
    dlg.close();
    applyConfig(url, url ? secret : '');
  });
  $('#cfgCancel').addEventListener('click', () => dlg.close());
  $('#cfgOff').addEventListener('click', () => {
    if (!confirm('이 기기에서 동기화를 끌까요? 메모는 이 기기와 드라이브에 그대로 남아요.')) return;
    dlg.close();
    applyConfig('', '');
  });
  $('#cfgLink').addEventListener('click', async () => {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify({ u: cfg.url, s: cfg.secret })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const link = location.origin + location.pathname + '#setup=' + data;
    try {
      await navigator.clipboard.writeText(link);
      cfgMsg.textContent = '링크를 복사했어요. 비밀번호가 들어 있으니 나에게만 보내세요';
      cfgMsg.className = 'msg';
    } catch (e) {
      prompt('이 링크를 다른 기기에서 여세요 (비밀번호가 들어 있어요)', link);
    }
  });
  $('#settingsBtn').addEventListener('click', openSettings);

  function handleSetupLink() {
    const m = location.hash.match(/^#setup=([A-Za-z0-9_-]+)$/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const data = JSON.parse(decodeURIComponent(escape(atob(b64))));
      if (data.u && confirm('이 기기에 동기화 설정을 적용할까요?')) applyConfig(data.u, data.s || '');
    } catch (e) {
      toast('설정 링크를 읽지 못했어요');
    }
  }

  /* ---------- 토스트 ---------- */
  let toastTimer = null;
  function hideToast() { toastEl.classList.remove('show'); }
  function toast(msg, actionLabel, action) {
    toastEl.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : '');
    if (action) toastEl.querySelector('button').addEventListener('click', () => { hideToast(); action(); });
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }

  /* ---------- 입력 ---------- */
  $('#newBtn').addEventListener('click', newNote);
  $('#newBtn2').addEventListener('click', newNote);
  pinBtn.addEventListener('click', togglePin);
  $('#deleteBtn').addEventListener('click', deleteCurrent);
  searchEl.addEventListener('input', renderList);
  searchEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchEl.value = ''; renderList(); searchEl.blur(); }
    if (e.key === 'Enter' || e.key === 'ArrowDown') {
      const first = listEl.querySelector('.item');
      if (first) { e.preventDefault(); select(first.dataset.id); listEl.focus(); }
    }
  });
  listEl.addEventListener('click', (e) => {
    const item = e.target.closest('.item');
    if (item) select(item.dataset.id);
  });
  listEl.addEventListener('dblclick', (e) => { if (e.target.closest('.item')) focusEditorEnd(); });
  listEl.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Enter') return;
    const items = [...listEl.querySelectorAll('.item')];
    if (!items.length) return;
    e.preventDefault();
    if (e.key === 'Enter') { if (currentId) focusEditorEnd(); return; }
    const i = items.findIndex((el) => el.dataset.id === currentId);
    const j = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
    select(items[j].dataset.id);
    const el = listEl.querySelector('.item.sel');
    if (el) el.scrollIntoView({ block: 'nearest' });
  });
  document.addEventListener('keydown', (e) => {
    const mod = isMac ? e.metaKey : e.ctrlKey;
    const ae = document.activeElement;
    if (selImg && !dlg.open && (ae === editor || ae === document.body)) {
      if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); removeImg(selImg); return; }
      if (e.key === 'Escape') { selectImg(null); return; }
    }
    if (mod && e.shiftKey && !e.altKey && e.code === 'KeyL' && currentId && !dlg.open) { e.preventDefault(); toggleChecklist(); }
    else if (mod && e.altKey && !e.shiftKey && e.code === 'KeyT' && currentId && !dlg.open) { e.preventDefault(); insertTable(); }
    else if (mod && e.altKey && e.code === 'KeyN') { e.preventDefault(); newNote(); }
    else if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyF' && !dlg.open) { e.preventDefault(); if (isMobile()) showList(); searchEl.focus(); searchEl.select(); }
  });
  mobileMQ.addEventListener('change', () => {
    if (!isMobile()) app.classList.remove('show-editor');
    renderList();
  });

  /* ---------- 시작 ---------- */
  function init() {
    // 지난번에 비워 둔 새 메모는 정리해요.
    for (const n of Object.values(notes)) if (!n.deleted && !n.rev && !n.text.trim()) delete notes[n.id];
    if (!currentId || !notes[currentId] || notes[currentId].deleted) currentId = isMobile() ? null : (sortedNotes()[0] || {}).id || null;
    renderList();
    renderEditor();
    setStatus(cfg.url ? 'idle' : 'local');
    handleSetupLink();
    if (/[?&]new\b/.test(location.search)) {
      history.replaceState(null, '', location.pathname);
      newNote();
    }
    sync();
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !TEST) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  init();
})();
</script>
</body>
</html>
